
name: Maximum Usage Stock Scanner (1900 Min Target)

on:
  schedule:
    # सोमवार से शुक्रवार तक हर 16 मिनट में 24 घंटे चलेगा
    - cron: '*/16 * * * 1-5'
  workflow_dispatch: # जरूरत पड़ने पर मैन्युअल चलाने के लिए

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Check out Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas yfinance ta

    - name: Run Scanner Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scanner.py
