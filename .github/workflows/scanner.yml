name: Nifty Zone Scanner Auto Schedule

on:
  workflow_dispatch: # मैन्युअल रूप से जब चाहें तब चलाने के लिए
  schedule:
    # 1. शाम 4:00 बजे IST (सोमवार से शुक्रवार) -> 10:30 AM UTC
    - cron: '30 10 * * 1-5'
    # 2. सुबह 8:30 बजे IST (सोमवार से शुक्रवार) -> 03:00 AM UTC
    - cron: '0 3 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas numpy

      - name: Run Scanner Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
